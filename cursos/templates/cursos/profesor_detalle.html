<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Profesor - {{ profesor.nombre }}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

</head>
<body class="container mt-4">
    <a href="{% url 'web_lista_cursos' %}" class="btn btn-outline-secondary mb-3">« Volver al catálogo</a>
    
    <div class="card p-4">
        <h2 class="text-success">{{ profesor.nombre }}</h2>
        <p><strong>Email:</strong> {{ profesor.email }}</p>
        <p><strong>Especialidad:</strong> {{ profesor.especialidad }}</p>
        <hr>
        
        <h4>Cursos que dicta</h4>
        <ul class="list-group col-md-6 mt-2">
            {% for curso in cursos %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    {{ curso.nombre }}
                    <span class="badge bg-primary rounded-pill">{{ curso.codigo }}</span>
                </li>
            {% empty %}
                <li class="list-group-item list-group-item-warning">Este profesor no tiene cursos asignados.</li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
